      - bot_token: ${TELEGRAM_BOT_TOKEN}  # bot token from .env
        chat_id: ${TG_CONTAINERS_CRIT_CHAT}  # group of the topic
        message_thread_id: ${TG_CONTAINERS_CRIT_TOPIC}  # forum topic; empty = general chat
