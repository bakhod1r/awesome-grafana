  - name: deploys  # Deploys topic: silent, no ✅ follow-up
    telegram_configs:  # Telegram integration(s) of this receiver
      - bot_token: ${TELEGRAM_BOT_TOKEN}  # bot token from .env
        chat_id: ${TG_DEPLOYS_WARN_CHAT}  # group of the topic
        message_thread_id: ${TG_DEPLOYS_WARN_TOPIC}  # forum topic; empty = general chat
        parse_mode: HTML  # allow <b>, <i> and <a> tags
        send_resolved: false  # nothing to resolve
        disable_notifications: true  # delivered silently
        message: '{{ template "telegram.message" . }}'  # body built from templates/telegram.tmpl

  # Receiver with no integrations: alerts routed here are accepted and dropped.
  - name: blackhole  # receiver with no integrations: accepts and drops

# Suppress lower-priority alerts while a related higher-priority one is firing.
# Example: the database is down (P1), so "too many connections" (P2) on it adds nothing.
inhibit_rules:  # mute some alerts while others fire
  - source_matchers: [priority="P1"]  # if a P1 like this is firing...
    target_matchers: [priority=~"P2|P3"]  # ...mute P2 and P3 alerts...
    # Only when these labels match, i.e. the same category, host AND container.
    # Without "name", one cadvisor alert would mute every container; without "category",
    # a server alert would mute a database alert on the same host.
    equal: [category, instance, name]  # ...when these labels are equal
  - source_matchers: [priority="P2"]  # same for P2 over P3
    target_matchers: [priority="P3"]
    equal: [category, instance, name]
  # Alerts without priority (custom rules, make test-alert): critical mutes warning.
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning", priority=""]
    equal: [category, instance, name]
