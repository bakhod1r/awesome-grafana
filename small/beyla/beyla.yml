# Grafana Beyla: HTTP metrics and traces of your apps through eBPF, with no change to the app.
# It watches the processes listening on the ports below (any language: Node/Bun, Python, Go, ...),
# also apps on --network host. Metrics: :9400/metrics, scraped by Prometheus (job "beyla"), renamed
# there to http_requests_total / http_request_duration_seconds for the App Endpoints dashboard.
# Traces: OTLP to Vector, then Tempo.
# Reload after editing: docker compose --profile beyla restart beyla
discovery:  # which processes get instrumented
  services:
    # One entry per app: the port it listens on, and the name shown in Grafana (service label).
    - name: lms_backend_dev
      open_ports: 4000
    # - name: lms_backend_prod
    #   open_ports: 4001
  exclude_services:  # never instrument these, even if they listen on the port
    # Docker publishes container ports through dockerd/docker-proxy on the host, so they also
    # "own" the port and would show up as the app.
    - exe_path: "dockerd|docker-proxy|containerd"

routes:
  # /api/users/123 and /api/users/124 become one row: /api/users/*
  unmatched: heuristic

prometheus_export:
  port: 9400
  path: /metrics
  features: [application]  # HTTP request rate, errors, duration per route

otel_traces_export:
  endpoint: http://vector:4317  # same entry point as apps that send OTLP themselves
  protocol: grpc
