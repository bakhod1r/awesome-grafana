# Reverse proxy in front of Grafana that adds a custom look (background gradient, translucent
# panels) without touching the Grafana image. Every HTML page gets one extra <link> to
# theme/theme.css before </head>; everything else is passed through unchanged.
# Grafana itself is still reachable directly on :3002 (plain look).
# Reload after editing: docker compose restart grafana-proxy

events {}

http {
  include /etc/nginx/mime.types;  # Content-Type for theme.css

  # WebSocket upgrade for Grafana Live (/api/live/ws): live panel updates.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80;

    # Our stylesheet. Short cache so edits show up on the next reload.
    location /custom-theme/ {
      alias /etc/nginx/theme/;
      add_header Cache-Control "no-cache";
    }

    # Resolve "grafana" on every request (Docker DNS, cached 10s), not once at start: a recreated
    # Grafana container gets a new IP, and a startup-resolved address would give 502 until restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $grafana http://grafana:3000;

    location / {
      proxy_pass $grafana;
      # Keep the browser's host:port. Grafana compares it with the Origin header on
      # POST requests and rejects mismatches ("origin not allowed").
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_http_version 1.1;

      # sub_filter can only edit uncompressed responses: ask Grafana not to gzip.
      proxy_set_header Accept-Encoding "";
      sub_filter_types text/html;  # only HTML pages (the default, stated for clarity)
      sub_filter_once on;  # one stylesheet link per page
      sub_filter "</head>" '<link rel="stylesheet" href="/custom-theme/theme.css"></head>';
    }
  }
}
