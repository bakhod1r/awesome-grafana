# Grafana-managed alert rules: a dead man's switch for the Prometheus → Alertmanager → Telegram path.
# Grafana queries VictoriaMetrics itself and notifies Telegram directly (contact-points.yml),
# so these still work when Prometheus or Alertmanager is down.
# Not covered: the whole machine or Docker going down — then Grafana is down too.
#
# Each rule: query A (data) → threshold C (condition). The rule fires when C is true for "for".
#   noDataState / execErrState: Alerting = treat "no data" or "query failed" as a problem,
#   which is exactly what happens when the thing being watched is dead.
apiVersion: 1  # provisioning file format version
groups:  # rule groups
  - orgId: 1                       # default Grafana organisation
    name: dead-mans-switch          # rule group; all rules in a group are evaluated together
    folder: Self-monitoring         # folder shown in Grafana → Alerting → Alert rules
    interval: 1m                    # evaluate every minute
    rules:  # rules of this group
      # Prometheus always fires Watchdog and writes it to VictoriaMetrics as an ALERTS series.
      # If it is missing: Prometheus is down, rule evaluation stopped, or remote_write is broken.
      # "or vector(0)" turns "no series" into 0, so the threshold (< 1) can catch it.
      - uid: watchdog-missing        # fixed id: provisioning updates this rule instead of duplicating it
        title: WatchdogMissing       # becomes the alertname label
        condition: C                 # the step whose result decides firing (true = firing)
        data:  # query and expression steps
          # Step A: the query (PromQL against VictoriaMetrics).
          - refId: A  # step A: query
            relativeTimeRange: { from: 600, to: 0 }   # look back 10m
            datasourceUid: victoriametrics  # run on VictoriaMetrics
            model:  # step definition
              refId: A  # must match the step refId
              expr: count(ALERTS{alertname="Watchdog",alertstate="firing"}) or vector(0)  # PromQL query
              instant: true          # one value "now", not a time series
          # Step C: a server-side expression (__expr__) that compares A to a threshold.
          - refId: C  # step C: threshold
            datasourceUid: __expr__  # Grafana server-side expression
            model:  # step definition
              refId: C  # must match the step refId
              type: threshold  # compare a value to a threshold
              expression: A          # input: result of step A
              conditions:  # threshold rule
                - evaluator: { type: lt, params: [1] }   # true when A < 1, i.e. Watchdog not found
        # The same structure is used by the two rules below; only the query and texts differ.
        noDataState: Alerting        # query returned nothing → treat as broken
        execErrState: Alerting       # query failed (e.g. VictoriaMetrics down) → treat as broken
        for: 3m                     # tolerate a quick Prometheus restart
        labels: { severity: critical }  # severity label
        annotations:  # message text
          summary: Monitoring pipeline is broken  # message headline
          description: The Watchdog alert is missing. Prometheus is down, rule evaluation stopped, or remote_write to VictoriaMetrics is failing. Alertmanager alerts may not be delivered.  # message body
          dashboard: alerts  # Grafana "Alerts" dashboard uid
      # Prometheus is fine but cannot scrape Alertmanager: alerts are evaluated but nobody delivers them.
      - uid: alertmanager-down  # stable id
        title: AlertmanagerDown  # alertname label
        condition: C  # step that decides firing
        data:  # query and expression steps
          - refId: A  # step A: query
            relativeTimeRange: { from: 600, to: 0 }   # look back 10m
            datasourceUid: victoriametrics  # run on VictoriaMetrics
            model:  # step definition
              refId: A  # must match the step refId
              expr: max(up{job="alertmanager"}) or vector(0)  # PromQL query
              instant: true  # single value now
          - refId: C  # step C: threshold
            datasourceUid: __expr__  # Grafana server-side expression
            model:  # step definition
              refId: C  # must match the step refId
              type: threshold  # compare a value to a threshold
              expression: A  # input: step A
              conditions:  # threshold rule
                - evaluator: { type: lt, params: [1] }  # true when A < 1
        noDataState: Alerting  # no data = broken
        execErrState: Alerting  # query error = broken
        for: 2m  # must hold 2m before firing
        labels: { severity: critical }  # severity label
        annotations:  # message text
          summary: Alertmanager is down  # message headline
          description: Prometheus cannot scrape Alertmanager. Telegram alerts from Alertmanager are not being delivered.  # message body
          dashboard: alerts  # Grafana "Alerts" dashboard uid
      # The query itself always returns 1, so the rule only fires through execErrState:
      # i.e. when Grafana cannot reach VictoriaMetrics at all.
      - uid: victoriametrics-down  # stable id
        title: VictoriaMetricsUnreachable  # alertname label
        condition: C  # step that decides firing
        data:  # query and expression steps
          - refId: A  # step A: query
            relativeTimeRange: { from: 600, to: 0 }   # look back 10m
            datasourceUid: victoriametrics  # run on VictoriaMetrics
            model:  # step definition
              refId: A  # must match the step refId
              expr: vector(1)  # PromQL query
              instant: true  # single value now
          - refId: C  # step C: threshold
            datasourceUid: __expr__  # Grafana server-side expression
            model:  # step definition
              refId: C  # must match the step refId
              type: threshold  # compare a value to a threshold
              expression: A  # input: step A
              conditions:  # threshold rule
                - evaluator: { type: lt, params: [1] }  # true when A < 1
        noDataState: Alerting  # no data = broken
        execErrState: Alerting  # query error = broken
        for: 2m  # must hold 2m before firing
        labels: { severity: critical }  # severity label
        annotations:  # message text
          summary: VictoriaMetrics is unreachable  # message headline
          description: Grafana cannot query VictoriaMetrics. Dashboards are empty and Grafana-side checks are blind.  # message body
          dashboard: alerts  # Grafana "Alerts" dashboard uid
