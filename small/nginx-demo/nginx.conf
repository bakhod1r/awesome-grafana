# Demo nginx that writes logs to FILES (like nginx installed with apt and run by systemd),
# so Vector's file pipeline (sources.nginx) is tested exactly as on a real server.
# Not for production use: it only serves test endpoints.

worker_processes 1;                                  # one worker is plenty for a demo
error_log /var/log/nginx-demo/error.log warn;        # error log FILE, level warn and above
pid /tmp/nginx.pid;                                  # writable path for the pid file

events { worker_connections 256; }                   # max simultaneous connections per worker

http {
  # Standard "combined" format + request time. Vector's regex expects exactly this layout.
  log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'rt=$request_time';
  # Not /var/log/nginx/access.log: in the official image that path is a symlink to stdout.
  access_log /var/log/nginx-demo/access.log timed;

  server {
    listen 80;                                       # inside the Docker network only (no host port)

    location = /           { return 200 "ok\n"; }    # normal request (blackbox probes this)
    location = /status/401 { return 401 "unauthorized\n"; }   # test: auth failures
    location = /status/404 { return 404 "not found\n"; }      # test: client errors
    location = /status/500 { return 500 "server error\n"; }   # test: server errors
  }
}
