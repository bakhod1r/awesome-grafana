# Custom metrics for postgres-exporter (--extend.query-path). Each top-level key becomes a
# metric prefix: pg_app_activity_count, pg_top_statements_calls, ...
# master: true = run only against the DSN database (cluster-wide views); without it the query
# runs in every auto-discovered database.

# Sessions per service. application_name is what the app sets in its connection string;
# empty names show as "unknown". This is the "per service" breakdown of the dashboard.
pg_app_activity:
  master: true
  query: |
    SELECT coalesce(nullif(application_name, ''), 'unknown') AS application,
           coalesce(usename, '') AS usename,
           coalesce(datname, '') AS datname,
           coalesce(state, 'unknown') AS state,
           coalesce(wait_event_type, 'none') AS wait_event_type,
           count(*) AS count,
           coalesce(max(extract(epoch FROM now() - xact_start)), 0) AS max_tx_seconds,
           coalesce(max(extract(epoch FROM now() - query_start)) FILTER (WHERE state = 'active'), 0) AS max_query_seconds,
           coalesce(max(extract(epoch FROM now() - state_change)) FILTER (WHERE state LIKE 'idle in transaction%'), 0) AS max_idle_tx_seconds
    FROM pg_stat_activity
    WHERE backend_type = 'client backend' AND pid <> pg_backend_pid()
    GROUP BY 1, 2, 3, 4, 5
  metrics:
    - application: { usage: LABEL, description: application_name of the session }
    - usename: { usage: LABEL, description: database user }
    - datname: { usage: LABEL, description: database }
    - state: { usage: LABEL, description: "active, idle, idle in transaction, ..." }
    - wait_event_type: { usage: LABEL, description: "what the session waits on (Lock, IO, Client, ...); none = running on CPU" }
    - count: { usage: GAUGE, description: Sessions }
    - max_tx_seconds: { usage: GAUGE, description: Age of the oldest open transaction }
    - max_query_seconds: { usage: GAUGE, description: Runtime of the longest running query }
    - max_idle_tx_seconds: { usage: GAUGE, description: Longest time a session sat idle inside a transaction }

# Sessions blocked by another session's lock, per service.
pg_app_blocked:
  master: true
  query: |
    SELECT coalesce(nullif(application_name, ''), 'unknown') AS application,
           coalesce(datname, '') AS datname,
           count(*) AS sessions,
           coalesce(max(extract(epoch FROM now() - query_start)), 0) AS max_wait_seconds
    FROM pg_stat_activity
    WHERE cardinality(pg_blocking_pids(pid)) > 0
    GROUP BY 1, 2
  metrics:
    - application: { usage: LABEL, description: application_name of the blocked session }
    - datname: { usage: LABEL, description: database }
    - sessions: { usage: GAUGE, description: Blocked sessions }
    - max_wait_seconds: { usage: GAUGE, description: Longest wait }

# Top 30 statements by total execution time, with the (normalised, truncated) query text.
# Counters reset when pg_stat_statements_reset() is called; rate()/increase() handle that.
pg_top_statements:
  master: true
  query: |
    SELECT s.queryid::text AS queryid,
           d.datname AS datname,
           r.rolname AS usename,
           left(regexp_replace(s.query, '\s+', ' ', 'g'), 160) AS query,
           s.calls AS calls,
           s.total_exec_time / 1000 AS exec_seconds,
           s.mean_exec_time / 1000 AS mean_seconds,
           s.max_exec_time / 1000 AS max_seconds,
           s.stddev_exec_time / 1000 AS stddev_seconds,
           s.rows AS rows,
           s.shared_blks_hit AS shared_blks_hit,
           s.shared_blks_read AS shared_blks_read,
           s.temp_blks_written AS temp_blks_written,
           (s.blk_read_time + s.blk_write_time) / 1000 AS io_seconds
    FROM pg_stat_statements s
    JOIN pg_database d ON d.oid = s.dbid
    JOIN pg_roles r ON r.oid = s.userid
    WHERE s.query NOT ILIKE '%pg_stat_statements%'
    ORDER BY s.total_exec_time DESC
    LIMIT 30
  metrics:
    - queryid: { usage: LABEL, description: pg_stat_statements query id }
    - datname: { usage: LABEL, description: database }
    - usename: { usage: LABEL, description: database user }
    - query: { usage: LABEL, description: normalised query text, first 160 characters }
    - calls: { usage: COUNTER, description: Executions }
    - exec_seconds: { usage: COUNTER, description: Total execution time }
    - mean_seconds: { usage: GAUGE, description: Mean execution time since the last reset }
    - max_seconds: { usage: GAUGE, description: Slowest execution since the last reset }
    - stddev_seconds: { usage: GAUGE, description: Standard deviation of execution time }
    - rows: { usage: COUNTER, description: Rows returned or affected }
    - shared_blks_hit: { usage: COUNTER, description: Blocks served from shared buffers }
    - shared_blks_read: { usage: COUNTER, description: Blocks read from disk or OS cache }
    - temp_blks_written: { usage: COUNTER, description: Temp blocks written (sorts/hashes spilling to disk) }
    - io_seconds: { usage: COUNTER, description: Time spent reading and writing blocks (track_io_timing) }

# Per-table size, scans, writes, cache hit and vacuum age, in every database.
# (The exporter's built-in table collectors only see the DSN database; this query runs in all of them.)
pg_table:
  query: |
    SELECT current_database() AS datname, t.schemaname, t.relname,
           pg_total_relation_size(t.relid) AS total_bytes,
           pg_relation_size(t.relid) AS table_bytes,
           pg_indexes_size(t.relid) AS index_bytes,
           t.seq_scan, t.seq_tup_read,
           coalesce(t.idx_scan, 0) AS idx_scan,
           t.n_tup_ins, t.n_tup_upd, t.n_tup_hot_upd, t.n_tup_del,
           t.vacuum_count + t.autovacuum_count AS vacuum_count,
           t.analyze_count + t.autoanalyze_count AS analyze_count,
           coalesce(io.heap_blks_hit, 0) AS heap_blks_hit,
           coalesce(io.heap_blks_read, 0) AS heap_blks_read,
           coalesce(io.idx_blks_hit, 0) AS idx_blks_hit,
           coalesce(io.idx_blks_read, 0) AS idx_blks_read,
           t.n_live_tup AS live_tuples,
           t.n_dead_tup AS dead_tuples,
           coalesce(extract(epoch FROM now() - greatest(t.last_vacuum, t.last_autovacuum)), -1) AS since_vacuum_seconds,
           coalesce(extract(epoch FROM now() - greatest(t.last_analyze, t.last_autoanalyze)), -1) AS since_analyze_seconds
    FROM pg_stat_user_tables t
    JOIN pg_statio_user_tables io USING (relid)
  metrics:
    - datname: { usage: LABEL, description: database }
    - schemaname: { usage: LABEL, description: schema }
    - relname: { usage: LABEL, description: table }
    - total_bytes: { usage: GAUGE, description: Table + indexes + TOAST }
    - table_bytes: { usage: GAUGE, description: Table heap only }
    - index_bytes: { usage: GAUGE, description: All indexes of the table }
    - seq_scan: { usage: COUNTER, description: Sequential scans }
    - seq_tup_read: { usage: COUNTER, description: Rows read by sequential scans }
    - idx_scan: { usage: COUNTER, description: Index scans }
    - n_tup_ins: { usage: COUNTER, description: Rows inserted }
    - n_tup_upd: { usage: COUNTER, description: Rows updated }
    - n_tup_hot_upd: { usage: COUNTER, description: "Rows HOT-updated (no index write)" }
    - n_tup_del: { usage: COUNTER, description: Rows deleted }
    - vacuum_count: { usage: COUNTER, description: Vacuums (manual + auto) }
    - analyze_count: { usage: COUNTER, description: Analyzes (manual + auto) }
    - heap_blks_hit: { usage: COUNTER, description: Table blocks found in shared buffers }
    - heap_blks_read: { usage: COUNTER, description: Table blocks read from disk }
    - idx_blks_hit: { usage: COUNTER, description: Index blocks found in shared buffers }
    - idx_blks_read: { usage: COUNTER, description: Index blocks read from disk }
    - live_tuples: { usage: GAUGE, description: Estimated live rows }
    - dead_tuples: { usage: GAUGE, description: Dead rows waiting for VACUUM }
    - since_vacuum_seconds: { usage: GAUGE, description: "Seconds since the last (auto)vacuum, -1 = never" }
    - since_analyze_seconds: { usage: GAUGE, description: "Seconds since the last (auto)analyze, -1 = never" }

# Per-index scans and size, in every database. idx_scan = 0 over a long time means the index
# is never used: it still costs disk and slows every write ("Unused indexes" on the dashboard).
# Unique and primary key indexes are skipped: they enforce constraints even with 0 scans.
pg_index:
  query: |
    SELECT current_database() AS datname, s.schemaname, s.relname, s.indexrelname,
           s.idx_scan, s.idx_tup_read, s.idx_tup_fetch,
           pg_relation_size(s.indexrelid) AS size_bytes
    FROM pg_stat_user_indexes s
    JOIN pg_index i USING (indexrelid)
    WHERE NOT i.indisunique AND NOT i.indisprimary
  metrics:
    - datname: { usage: LABEL, description: database }
    - schemaname: { usage: LABEL, description: schema }
    - relname: { usage: LABEL, description: table }
    - indexrelname: { usage: LABEL, description: index }
    - idx_scan: { usage: COUNTER, description: Scans that used this index }
    - idx_tup_read: { usage: COUNTER, description: Index entries returned }
    - idx_tup_fetch: { usage: COUNTER, description: Table rows fetched through this index }
    - size_bytes: { usage: GAUGE, description: Index size on disk }
