# Elasticsearch / OpenSearch metrics from elasticsearch-exporter (job "elasticsearch"), shown on the "Search" dashboard.
# The demo cluster (compose profile "search") is enabled below. For your own cluster: point the exporter's
# --es.uri at it and add the exporter here. Without the profile this target is down: set the file to [].
- targets: [elasticsearch-exporter:9114]
  labels: { project: grafana-s, container: grafana-s-elasticsearch, env: demo }
