# MongoDB metrics from percona mongodb_exporter (job "mongodb"), shown on the "NoSQL" dashboard.
# The demo database (compose profiles "mongodb" / "nosql") is enabled below. For your own MongoDB: set
# MONGODB_EXPORTER_URI in .env. Without the profile this target is down: set the file to [].
- targets: [mongodb-exporter:9216]
  labels: { project: grafana-s, container: grafana-s-mongodb, env: demo }
