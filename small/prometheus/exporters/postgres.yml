# PostgreSQL metrics from postgres-exporter (job "postgres"), shown on the "PostgreSQL" dashboard.
# 1. Set POSTGRES_EXPORTER_DSN_DOCKER / POSTGRES_EXPORTER_DSN_SERVER in .env
#    (user with the pg_monitor role).
# 2. docker compose --profile postgres up -d
# 3. Keep one entry per running exporter. Prometheus re-reads this file every 30s.
# "instance" is the name shown in the dashboard's Server picker.
- targets: [grafana-s-postgres-exporter-docker:9187]
  labels: { instance: docker }   # PostgreSQL in a Docker container
- targets: [host.docker.internal:39188]  # runs in the host network (docker-compose.yml)
  labels: { instance: server }   # PostgreSQL installed on the server itself
