# DNS probes (job "blackbox-dns", module dns_a): the target is a DNS SERVER, not a domain.
# Each server is asked to resolve query_name from blackbox/blackbox.yml (google.com by default).
# Re-read every 30s, no restart needed. Failures fire ProbeDown.

- targets:  # one group of targets (can carry shared labels)
    - 1.1.1.1  # example: Cloudflare resolver; replace with your own DNS server(s)
    - 8.8.8.8  # example: Google resolver
