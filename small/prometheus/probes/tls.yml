# TCP + TLS probes (job "blackbox-tls", module tcp_tls): port open AND TLS handshake works.
# Cert expiry is tracked, so SslExpiresSoon / SslExpiresCritical cover these hosts.
# Format host:port. Re-read every 30s, no restart needed.

- targets:  # one group of targets (can carry shared labels)
    - api.telegram.org:443  # Alertmanager sends every alert here: unreachable = no alert messages
