# Prometheus: scrapes metrics from targets, evaluates alert rules, forwards data to VictoriaMetrics.
# Reload after editing: docker compose restart prometheus

global:  # defaults for all jobs
  # How often every target is scraped. Lower = finer graphs, more storage and CPU.
  # 15s is the common default; rate()/increase() windows should be at least 4x this (1m+).
  scrape_interval: 15s  # how often each target is scraped
  # How often alert rules are evaluated. Defaults to 1m; matching scrape_interval makes alerts react faster.
  evaluation_interval: 15s  # how often alert rules run

# Alert rule files. Glob, so any new *.yml dropped in rules/ is picked up on reload.
rule_files:  # alert rule files
  - /etc/prometheus/rules/*.yml  # every .yml in rules/

# Where firing alerts are sent.
alerting:  # where to send alerts
  alertmanagers:  # Alertmanager instances
    - static_configs: [{ targets: ["alertmanager:9093"] }]  # our Alertmanager

# Copy every scraped sample to VictoriaMetrics for long-term storage.
# If VictoriaMetrics is down, Prometheus queues samples and retries (backed by its 2d local storage).
remote_write:  # copy samples to long-term storage
  - url: http://victoriametrics:8428/api/v1/write  # VictoriaMetrics write endpoint

# What to scrape. Each job is a group of targets of the same kind; "job" becomes a label on every metric.
# Hostnames are Docker Compose service names, resolved on the internal network.
scrape_configs:  # scrape jobs
  # Prometheus's own health: rule evaluation, remote_write queue, scrape errors.
  - job_name: prometheus  # job="prometheus" label on every metric from this job
    static_configs: [{ targets: ["localhost:9090"] }]  # scrape http://localhost:9090/metrics

  # Host metrics (CPU, memory, disk, network).
  - job_name: node  # job="node" label on every metric from this job
    static_configs: [{ targets: ["node-exporter:9100"] }]  # scrape http://node-exporter:9100/metrics

  # VictoriaMetrics's own health: ingestion rate, disk usage.
  - job_name: victoriametrics  # job="victoriametrics" label on every metric from this job
    static_configs: [{ targets: ["victoriametrics:8428"] }]  # scrape http://victoriametrics:8428/metrics

  # Per-container metrics.
  - job_name: cadvisor  # job="cadvisor" label on every metric from this job
    static_configs: [{ targets: ["cadvisor:8080"] }]  # scrape http://cadvisor:8080/metrics
    metric_relabel_configs:  # applied to every scraped series
      # Docker label container.project=<name> puts a container into that project on every dashboard,
      # even when it was started without compose (docker run) or by another compose file.
      - source_labels: [container_label_container_project]  # the Docker label, as cAdvisor exports it
        regex: (.+)  # only when set
        target_label: container_label_com_docker_compose_project  # what all dashboards group by
      # Keep only the Docker labels the dashboards use (compose project/service, container.*). Images such as
      # Elasticsearch carry 15+ OCI labels; VictoriaMetrics keeps at most 30 labels per series and silently
      # drops the rest (including "name"), so those containers would vanish from every dashboard.
      - regex: container_label_(com_docker_compose_project|com_docker_compose_service|container_.+)  # labels to keep
        action: labelmap  # copy them aside...
        replacement: keep_${1}
      - regex: container_label_.+  # ...drop every Docker label...
        action: labeldrop
      - regex: keep_(.+)  # ...and put the kept ones back
        action: labelmap
        replacement: container_label_${1}
      - regex: keep_.+  # remove the temporary copies
        action: labeldrop

  # Blackbox exporter's own health (not the probes themselves).
  - job_name: blackbox  # job="blackbox" label on every metric from this job
    static_configs: [{ targets: ["blackbox-exporter:9115"] }]  # scrape http://blackbox-exporter:9115/metrics

  # Website probes. Prometheus asks blackbox to check each site and stores the result.
  - job_name: blackbox-http  # job="blackbox-http" label on every metric from this job
    metrics_path: /probe            # blackbox endpoint that runs a probe and returns its result
    params:  # URL query parameters
      module: [http_2xx]            # probe type, defined in blackbox/blackbox.yml
    # Targets are read from a separate file and re-read every 30s: add a site there, no restart needed.
    file_sd_configs:  # targets from a file
      - files: [/etc/prometheus/sites.yml]  # the sites list
        refresh_interval: 30s  # re-read the file this often
    # By default Prometheus would scrape each target directly (e.g. https://google.com/probe).
    # These rules rewrite the request so it goes to blackbox with the site as a parameter:
    #   http://blackbox-exporter:9115/probe?module=http_2xx&target=https://google.com
    relabel_configs:  # rewrite labels before scraping
      - source_labels: [__address__]        # the site from sites.yml...
        target_label: __param_target        # ...becomes the ?target= query parameter
      - source_labels: [__param_target]  # copy the site URL...
        target_label: instance              # show the site (not blackbox) as "instance" in graphs/alerts
      - target_label: __address__  # scrape blackbox, not the site itself
        replacement: blackbox-exporter:9115 # actually send the request to blackbox

  # Other probe types. Same relabeling as blackbox-http; only the module and the targets file differ.
  # Targets: prometheus/probes/<type>.yml, re-read every 30s.
  - job_name: blackbox-tcp  # port open? (module tcp_connect)
    metrics_path: /probe  # blackbox probe endpoint
    params: { module: [tcp_connect] }  # probe type from blackbox/blackbox.yml
    file_sd_configs: [{ files: [/etc/prometheus/probes/tcp.yml], refresh_interval: 30s }]  # targets file
    relabel_configs: &blackbox_relabel  # same rewrite as blackbox-http; reused by the jobs below
      - { source_labels: [__address__], target_label: __param_target }  # target becomes ?target=
      - { source_labels: [__param_target], target_label: instance }  # show the target as instance
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }  # scrape blackbox itself
  - job_name: blackbox-tls  # port open + TLS handshake + cert expiry (module tcp_tls)
    metrics_path: /probe  # blackbox probe endpoint
    params: { module: [tcp_tls] }  # probe type from blackbox/blackbox.yml
    file_sd_configs: [{ files: [/etc/prometheus/probes/tls.yml], refresh_interval: 30s }]  # targets file
    relabel_configs: *blackbox_relabel  # same rewrite as blackbox-tcp
  - job_name: blackbox-icmp  # ping (module icmp)
    metrics_path: /probe  # blackbox probe endpoint
    params: { module: [icmp] }  # probe type from blackbox/blackbox.yml
    file_sd_configs: [{ files: [/etc/prometheus/probes/icmp.yml], refresh_interval: 30s }]  # targets file
    relabel_configs: *blackbox_relabel  # same rewrite as blackbox-tcp
  - job_name: blackbox-dns  # DNS server answers (module dns_a)
    metrics_path: /probe  # blackbox probe endpoint
    params: { module: [dns_a] }  # probe type from blackbox/blackbox.yml
    file_sd_configs: [{ files: [/etc/prometheus/probes/dns.yml], refresh_interval: 30s }]  # targets file
    relabel_configs: *blackbox_relabel  # same rewrite as blackbox-tcp

  # Batch/cron jobs push their result here (they finish before a scrape could catch them).
  # honor_labels keeps the job/instance labels the pusher set, instead of "pushgateway".
  - job_name: pushgateway  # job label is overwritten by honor_labels for pushed metrics
    honor_labels: true  # keep the pushed job/instance labels
    static_configs: [{ targets: ["pushgateway:9091"] }]  # scrape http://pushgateway:9091/metrics

  # Internet speed. Every scrape runs a full speed test, so scrape rarely and wait long.
  # Samples are 30m apart: queries use last_over_time(...[1h]) so values don't go stale after 5m.
  - job_name: speedtest  # job="speedtest" label on every metric from this job
    scrape_interval: 30m  # one speed test every 30 minutes
    scrape_timeout: 2m  # a test takes 20-60s
    static_configs: [{ targets: ["speedtest-exporter:9798"] }]  # scrape http://speedtest-exporter:9798/metrics

  # Optional exporters for your own services. Each targets file is empty until you enable it
  # (instructions inside the file), so a disabled exporter never shows up as TargetDown.
  - job_name: postgres  # postgres-exporter (compose profile "postgres")
    file_sd_configs: [{ files: [/etc/prometheus/exporters/postgres.yml], refresh_interval: 30s }]  # targets file
  - job_name: mysql  # mysqld-exporter (compose profile "mysql")
    file_sd_configs: [{ files: [/etc/prometheus/exporters/mysql.yml], refresh_interval: 30s }]  # targets file
  - job_name: redis  # redis_exporter (compose profile "redis")
    file_sd_configs: [{ files: [/etc/prometheus/exporters/redis.yml], refresh_interval: 30s }]  # targets file
  - job_name: nginx  # nginx-prometheus-exporter (compose profile "nginx")
    file_sd_configs: [{ files: [/etc/prometheus/exporters/nginx.yml], refresh_interval: 30s }]  # targets file
  - job_name: traefik  # Traefik's built-in /metrics, no exporter needed
    file_sd_configs: [{ files: [/etc/prometheus/exporters/traefik.yml], refresh_interval: 30s }]  # targets file
  - job_name: rabbitmq  # RabbitMQ built-in plugin, per-queue numbers (compose profile "queue")
    metrics_path: /metrics/per-object  # aggregated + one series per queue / exchange / connection
    file_sd_configs: [{ files: [/etc/prometheus/exporters/rabbitmq.yml], refresh_interval: 30s }]  # targets file
  - job_name: smartctl  # smartctl-exporter (compose profile "smart", Linux hosts only)
    file_sd_configs: [{ files: [/etc/prometheus/exporters/smartctl.yml], refresh_interval: 30s }]  # targets file
  - job_name: mongodb  # percona mongodb_exporter (compose profile "mongodb")
    file_sd_configs: [{ files: [/etc/prometheus/exporters/mongodb.yml], refresh_interval: 30s }]  # targets file
  - job_name: elasticsearch  # elasticsearch-exporter (compose profile "search")
    file_sd_configs: [{ files: [/etc/prometheus/exporters/elasticsearch.yml], refresh_interval: 30s }]  # targets file
  - job_name: memcached  # memcached-exporter (compose profile "nosql")
    file_sd_configs: [{ files: [/etc/prometheus/exporters/memcached.yml], refresh_interval: 30s }]  # targets file

  # Your own apps exposing /metrics. Containers in any compose project are found by the
  # discoverer service (/etc/prometheus-auto/*.json); exporters/apps.yml is for apps outside Docker.
  - job_name: apps  # job="apps" label on every metric from your services
    file_sd_configs: [{ files: [/etc/prometheus/exporters/apps.yml, /etc/prometheus-auto/*.json], refresh_interval: 30s }]  # hand-written + auto-discovered

  # Alertmanager's own health: notifications sent/failed. Also used by Grafana's AlertmanagerDown rule.
  - job_name: alertmanager  # job="alertmanager" label on every metric from this job
    static_configs: [{ targets: ["alertmanager:9093"] }]  # scrape http://alertmanager:9093/metrics

  # Logs stack health: ingestion rate and disk (VictoriaLogs), push errors (Vector),
  # rule evaluation errors (vmalert).
  - job_name: victorialogs  # job="victorialogs" label on every metric from this job
    static_configs: [{ targets: ["victorialogs:9428"] }]  # scrape http://victorialogs:9428/metrics
  - job_name: vector  # job="vector" label: log-derived metrics + Vector's own health
    static_configs: [{ targets: ["vector:9598"] }]  # scrape http://vector:9598/metrics
  - job_name: alloy  # job="alloy" label: profile collector health
    static_configs: [{ targets: ["alloy:12345"] }]  # scrape http://alloy:12345/metrics
  - job_name: vmalert  # job="vmalert" label on every metric from this job
    static_configs: [{ targets: ["vmalert:8880"] }]  # scrape http://vmalert:8880/metrics

  # Traces stack health: received/refused spans, block flushes, compaction, generator remote_write.
  - job_name: tempo  # job="tempo" label on every metric from this job
    static_configs: [{ targets: ["tempo:3200"] }]  # scrape http://tempo:3200/metrics
