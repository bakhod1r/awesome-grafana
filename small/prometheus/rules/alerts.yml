# Prometheus alert rules. Evaluated every evaluation_interval (prometheus.yml); firing alerts go to Alertmanager.
#
# Rule fields:
#   expr         PromQL condition. The alert fires for every series the query returns.
#   for          how long the condition must hold before firing. Filters out short spikes.
#                Omitted = fire on the first evaluation (used for one-off events like restarts).
#   labels       added to the alert. "severity" (critical/warning) drives routing in alertmanager.yml.
#   annotations  human text for the message. "dashboard" = Grafana dashboard uid for the message link.
#                {{ $labels.x }} = label value, {{ $value }} = query result.
#
# Check syntax: docker run --rm -i --entrypoint promtool prom/prometheus:v2.54.1 check rules /dev/stdin < prometheus/rules/alerts.yml

groups:  # list of rule groups; rules in a group are evaluated together, in order
  # Host health (node-exporter).
  - name: node  # group name, shown in the Prometheus/vmalert UI
    rules:  # rules of this group
      # Any scrape target unreachable. up is 1 on a successful scrape, 0 on failure.
      - alert: TargetDown  # alert name, also the alertname label
        expr: up{job!~"prometheus|victoriametrics|victorialogs|vector|vmalert|tempo|alertmanager"} == 0  # 1 = last scrape worked, 0 = failed; monitoring components: MonitoringComponentDown
        for: 1m  # condition must hold 1m before firing (shorter blips are ignored)
        labels: { severity: critical, category: server }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview): target of the Dashboard link
          summary: "{{ $labels.job }} is down"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $labels.instance }} has not responded for 1 minute."  # message body
      # CPU busy = 100% minus idle time, averaged over 5m to ignore short bursts.
      - alert: HighCpu  # alert name, also the alertname label
        expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90  # busy % per host = 100 - idle %, over 5m
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: warning, category: server }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview): target of the Dashboard link
          summary: "High CPU: {{ $value | printf \"%.0f\" }}%"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "CPU on {{ $labels.instance }} has been above 90% for 5 minutes."  # message body
      # MemAvailable (not MemFree) counts reclaimable cache, so this is real memory pressure.
      - alert: HighMemory  # alert name, also the alertname label
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90  # used % = 1 - available/total
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: warning, category: server }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview): target of the Dashboard link
          summary: "High memory: {{ $value | printf \"%.0f\" }}%"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Memory usage on {{ $labels.instance }} is above 90%."  # message body
      # Same, but at the edge: the kernel starts killing processes (OOM) or the server crawls on swap.
      - alert: MemoryCritical  # alert name, also the alertname label
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 95  # used % = 1 - available/total
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: critical, category: server }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview): target of the Dashboard link
          summary: "Memory almost exhausted: {{ $value | printf \"%.0f\" }}%"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $labels.instance }} has under 5% memory left: OOM kills are next. Find the biggest containers on the Docker dashboard."  # message body
      # CPU pinned for a long time: everything on the server slows down, not just one app.
      - alert: CpuCritical  # alert name, also the alertname label
        expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 95  # busy % = 100 - idle %
        for: 15m  # condition must hold 15m before firing (shorter blips are ignored)
        labels: { severity: critical, category: server }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview): target of the Dashboard link
          summary: "CPU saturated: {{ $value | printf \"%.0f\" }}%"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "CPU on {{ $labels.instance }} has been above 95% for 15 minutes."  # message body
      # Heavy swap use: RAM is too small for what runs on the server, every page fault is a disk read.
      - alert: SwapHigh  # alert name, also the alertname label
        expr: (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) * 100 > 50 and node_memory_SwapTotal_bytes > 0  # used swap %, only when swap exists
        for: 15m  # condition must hold 15m before firing (shorter blips are ignored)
        labels: { severity: warning, category: server }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview): target of the Dashboard link
          summary: "Swap {{ $value | printf \"%.0f\" }}% used"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $labels.instance }} keeps more than half its swap in use: the server needs more RAM or fewer containers."  # message body
      # Root filesystem only; tmpfs/overlay are virtual and would cause false alarms.
      - alert: DiskAlmostFull  # alert name, also the alertname label
        expr: instance:node_filesystem_root_used:percent > 85  # used % of the system disk (rules/recording.yml)
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: warning, category: server }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview): target of the Dashboard link
          summary: "Disk almost full: {{ $value | printf \"%.0f\" }}%"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "More than 85% of / is used on {{ $labels.instance }}."  # message body
      # Forecast instead of a fixed threshold: a disk at 60% that grows 5%/hour is more urgent than one
      # sitting at 90% for months. predict_linear extends the trend of the last window into the future.
      # The free-space condition keeps big, mostly empty disks from alerting on normal daily swings.
      - alert: DiskWillFillIn24h  # alert name, also the alertname label
        expr: |  # at the 6h trend, free space reaches 0 within 24h, and less than 40% is free now
          max by (instance, device) (
            predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|erofs|squashfs|fakeowner|nsfs|ramfs|devtmpfs|fuse.*", mountpoint!~"/etc/.+|/oldroot.*|/host_mnt.*|/run.*|/boot.*"}[6h], 24 * 3600) < 0
            and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|erofs|squashfs|fakeowner|nsfs|ramfs|devtmpfs|fuse.*", mountpoint!~"/etc/.+|/oldroot.*|/host_mnt.*|/run.*|/boot.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|erofs|squashfs|fakeowner|nsfs|ramfs|devtmpfs|fuse.*", mountpoint!~"/etc/.+|/oldroot.*|/host_mnt.*|/run.*|/boot.*"} < 0.4
          )
        for: 30m  # trend must hold 30m (a big temporary file does not count)
        labels: { severity: warning, category: server }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview): target of the Dashboard link
          summary: "Disk will be full within 24h: {{ $labels.device }} on {{ $labels.instance }}"  # message headline
          description: "At the pace of the last 6 hours, {{ $labels.device }} runs out of space within a day. Look for growing logs, volumes or images (docker system df)."  # message body
      - alert: DiskWillFillIn4h  # alert name, also the alertname label
        expr: |  # at the 1h trend, free space reaches 0 within 4h, and less than 20% is free now
          max by (instance, device) (
            predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|erofs|squashfs|fakeowner|nsfs|ramfs|devtmpfs|fuse.*", mountpoint!~"/etc/.+|/oldroot.*|/host_mnt.*|/run.*|/boot.*"}[1h], 4 * 3600) < 0
            and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|erofs|squashfs|fakeowner|nsfs|ramfs|devtmpfs|fuse.*", mountpoint!~"/etc/.+|/oldroot.*|/host_mnt.*|/run.*|/boot.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|erofs|squashfs|fakeowner|nsfs|ramfs|devtmpfs|fuse.*", mountpoint!~"/etc/.+|/oldroot.*|/host_mnt.*|/run.*|/boot.*"} < 0.2
          )
        for: 10m  # trend must hold 10m
        labels: { severity: critical, category: server }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview): target of the Dashboard link
          summary: "Disk full within 4 hours: {{ $labels.device }} on {{ $labels.instance }}"  # message headline
          description: "Free space on {{ $labels.device }} is falling fast. Services writing to it will start failing soon."  # message body
  # Website probes (blackbox-exporter, sites listed in prometheus/sites.yml).
  - name: sites  # group name, shown in the Prometheus/vmalert UI
    rules:  # rules of this group
      # Blackbox probe failed (timeout, non-2xx status, DNS or TLS error). 2m avoids alerting on one blip.
      - alert: SiteDown  # alert name, also the alertname label
        expr: probe_success{job="blackbox-http"} == 0  # 1 = probe succeeded, 0 = failed
        for: 2m  # condition must hold 2m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sites }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "Probes & SLO" dashboard (uid probes-slo): target of the Dashboard link
          summary: "Site down: {{ $labels.instance }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $labels.instance }} has not responded for 2 minutes."  # message body
      # Whole probe time (DNS + connect + TLS + response) above 3s for 5 minutes.
      - alert: SiteSlow  # alert name, also the alertname label
        expr: probe_duration_seconds{job="blackbox-http"} > 3  # total probe time in seconds
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: warning, category: sites }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "Probes & SLO" dashboard (uid probes-slo): target of the Dashboard link
          summary: "Site slow: {{ $labels.instance }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Response time {{ $value | printf \"%.1f\" }}s (over 3s)."  # message body
      # Seconds until the earliest cert in the chain expires, converted to days. for: 1h = no need to hurry.
      - alert: SslExpiresSoon  # alert name, also the alertname label
        expr: (probe_ssl_earliest_cert_expiry{job=~"blackbox-(http|tls)"} - time()) / 86400 < 14  # days until the certificate expires
        for: 1h  # condition must hold 1h before firing (shorter blips are ignored)
        labels: { severity: warning, category: sites }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "Probes & SLO" dashboard (uid probes-slo): target of the Dashboard link in Telegram
          summary: "SSL certificate expiring: {{ $labels.instance }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $value | printf \"%.0f\" }} days left."  # message body
      # Same, 3 days left: renewal (certbot, cert-manager) has clearly failed. Critical inhibits the warning above.
      - alert: SslExpiresCritical  # alert name, also the alertname label
        expr: (probe_ssl_earliest_cert_expiry{job=~"blackbox-(http|tls)"} - time()) / 86400 < 3  # days until the certificate expires
        for: 10m  # condition must hold 10m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sites }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "Probes & SLO" dashboard (uid probes-slo): target of the Dashboard link in Telegram
          summary: "SSL certificate expires in days: {{ $labels.instance }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Only {{ $value | printf \"%.1f\" }} days left. Automatic renewal is not working."  # message body
      # TCP / TLS / ping / DNS probe failed (listed in prometheus/probes/*.yml).
      - alert: ProbeDown  # alert name, also the alertname label
        expr: probe_success{job=~"blackbox-(tcp|tls|icmp|dns)"} == 0  # 1 = probe succeeded, 0 = failed
        for: 2m  # condition must hold 2m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sites }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "Probes & SLO" dashboard (uid probes-slo): target of the Dashboard link in Telegram
          summary: "{{ $labels.job }} probe failing: {{ $labels.instance }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $labels.instance }} has failed its {{ $labels.job }} check for 2 minutes."  # message body

  # SLO burn rate (Google SRE workbook, multi-window). Target: 99.9% of probes succeed over 30 days,
  # so the error budget is 0.1%. Burn rate = error ratio / 0.001; burn 1 uses up the budget in exactly
  # 30 days. The short window confirms the problem is still happening, so alerts clear quickly.
  # ICMP is left out: one lost ping packet is a failed probe, so normal internet packet loss (~0.5%)
  # burns a 99.9% budget on its own. Real ping outages still fire ProbeDown.
  # Change the target: replace 0.001 below and the default of the slo variable in grafana/dashboards/slo.json.
  - name: slo  # group name, shown in the Prometheus/vmalert UI
    rules:  # rules of this group
      # Burn 14.4 = 2% of the monthly budget gone in 1 hour (budget empty in ~2 days).
      - alert: SloFastBurn  # alert name, also the alertname label
        expr: |  # error ratio over 1h AND over 5m, both above 14.4x budget
          (1 - avg_over_time(probe_success{job=~"blackbox-(http|tcp|tls|dns)"}[1h])) / 0.001 > 14.4
          and (1 - avg_over_time(probe_success{job=~"blackbox-(http|tcp|tls|dns)"}[5m])) / 0.001 > 14.4
          and on (job, instance) probe_success  # still probed: a removed target stops alerting at once
        for: 2m  # condition must hold 2m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sites }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "Probes & SLO" dashboard (uid probes-slo): target of the Dashboard link in Telegram
          summary: "Error budget burning fast: {{ $labels.instance }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Burn rate {{ $value | printf \"%.0f\" }}x: at this pace the 30-day 99.9% budget is gone in under 2 days."  # message body
      # Burn 6 over 6h = 5% of the monthly budget gone in 6 hours (budget empty in ~5 days).
      - alert: SloSlowBurn  # alert name, also the alertname label
        expr: |  # error ratio over 6h AND over 30m, both above 6x budget
          (1 - avg_over_time(probe_success{job=~"blackbox-(http|tcp|tls|dns)"}[6h])) / 0.001 > 6
          and (1 - avg_over_time(probe_success{job=~"blackbox-(http|tcp|tls|dns)"}[30m])) / 0.001 > 6
          and on (job, instance) probe_success  # still probed: a removed target stops alerting at once
        for: 15m  # condition must hold 15m before firing (shorter blips are ignored)
        labels: { severity: warning, category: sites }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "Probes & SLO" dashboard (uid probes-slo): target of the Dashboard link in Telegram
          summary: "Error budget burning: {{ $labels.instance }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Burn rate {{ $value | printf \"%.1f\" }}x over 6h. Intermittent failures are eating the 30-day 99.9% budget."  # message body
  # App SLOs (job "apps"), same multi-window burn-rate method as the probe SLO above, per service.
  # Ratios come from the app-slo-recording group in rules/recording.yml. Objectives:
  #   availability 99.5% non-5xx (budget 0.005), latency 99% within 1s (budget 0.01).
  # A service needs at least 0.05 req/s over the long window, so a single failed request on an idle
  # service does not page anyone. Dashboard: "App SLO" (uid app-slo).
  - name: app-slo  # group name, shown in the Prometheus UI
    rules:  # rules of this group
      - alert: AppErrorBudgetFastBurn  # alert name, also the alertname label
        expr: |  # 5xx ratio over 1h AND 5m above 14.4x the 0.5% budget
          service:app_request_errors:ratio_rate1h / 0.005 > 14.4
          and service:app_request_errors:ratio_rate5m / 0.005 > 14.4
          and service:app_requests:rate1h > 0.05
        for: 2m  # condition must hold 2m before firing
        labels: { severity: critical, category: sites }  # loud Telegram message, repeated every 1h
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "App SLO" dashboard (uid app-slo)
          summary: "{{ $labels.service }}: error budget burning fast ({{ $value | printf \"%.0f\" }}x)"  # message headline
          description: "At this pace the 30-day 99.5% availability budget is gone in under 2 days. Check the slowest/failing endpoints on the App Endpoints dashboard."  # message body
      - alert: AppErrorBudgetSlowBurn  # alert name, also the alertname label
        expr: |  # 5xx ratio over 6h AND 30m above 6x the budget
          service:app_request_errors:ratio_rate6h / 0.005 > 6
          and service:app_request_errors:ratio_rate30m / 0.005 > 6
          and service:app_requests:rate6h > 0.05
        for: 15m  # condition must hold 15m before firing
        labels: { severity: warning, category: sites }  # silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "App SLO" dashboard (uid app-slo)
          summary: "{{ $labels.service }}: error budget burning ({{ $value | printf \"%.1f\" }}x)"  # message headline
          description: "Intermittent 5xx over the last 6 hours are eating the 30-day 99.5% budget (gone in ~5 days at this pace)."  # message body
      - alert: AppLatencyBudgetFastBurn  # alert name, also the alertname label
        expr: |  # share of >1s requests over 1h AND 5m above 14.4x the 1% budget
          service:app_request_slow:ratio_rate1h / 0.01 > 14.4
          and service:app_request_slow:ratio_rate5m / 0.01 > 14.4
          and service:app_requests:rate1h > 0.05
        for: 2m  # condition must hold 2m before firing
        labels: { severity: critical, category: sites }  # loud Telegram message, repeated every 1h
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "App SLO" dashboard (uid app-slo)
          summary: "{{ $labels.service }}: latency budget burning fast ({{ $value | printf \"%.0f\" }}x)"  # message headline
          description: "Far more than 1% of requests take over 1s. At this pace the 30-day latency budget is gone in under 2 days."  # message body
      - alert: AppLatencyBudgetSlowBurn  # alert name, also the alertname label
        expr: |  # share of >1s requests over 6h AND 30m above 6x the budget
          service:app_request_slow:ratio_rate6h / 0.01 > 6
          and service:app_request_slow:ratio_rate30m / 0.01 > 6
          and service:app_requests:rate6h > 0.05
        for: 15m  # condition must hold 15m before firing
        labels: { severity: warning, category: sites }  # silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "App SLO" dashboard (uid app-slo)
          summary: "{{ $labels.service }}: latency budget burning ({{ $value | printf \"%.1f\" }}x)"  # message headline
          description: "Slow requests (over 1s) over the last 6 hours are eating the 30-day latency budget."  # message body
  # Docker containers (cadvisor).
  - name: containers  # group name, shown in the Prometheus/vmalert UI
    rules:  # rules of this group
      # Only containers with a memory limit (limit > 0); without one the ratio is meaningless.
      - alert: ContainerHighMemory  # alert name, also the alertname label
        expr: container_memory_working_set_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} > 0.9 and container_spec_memory_limit_bytes{name!=""} > 0  # usage / limit, only for containers that have a limit
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: warning, category: containers }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "Probes & SLO" dashboard (uid probes-slo): target of the Dashboard link
          summary: "Container memory almost full: {{ $labels.name }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $labels.name }} is using over 90% of its memory limit."  # message body
      # Crash loop: 3+ starts in 15 minutes. Critical, so it inhibits the ContainerRestarted warning.
      - alert: ContainerRestartLoop  # alert name, also the alertname label
        expr: resets(container_cpu_usage_seconds_total{name!=""}[15m]) >= 3  # 3 or more restarts in 15m
        labels: { severity: critical, category: containers }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "Probes & SLO" dashboard (uid probes-slo): target of the Dashboard link
          summary: "Container restart loop: {{ $labels.name }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $labels.name }} restarted {{ $value }} times in 15 minutes."  # message body
      # cadvisor stopped seeing the container (stopped, removed or crashed without restart).
      # Also fires briefly after an intentional `docker compose down`.
      - alert: ContainerGone  # alert name, also the alertname label
        expr: time() - container_last_seen{name!=""} > 60  # seconds since cadvisor last saw the container
        for: 1m  # condition must hold 1m before firing (shorter blips are ignored)
        labels: { severity: critical, category: containers }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: probes-slo  # Grafana "Probes & SLO" dashboard (uid probes-slo): target of the Dashboard link
          summary: "Container stopped: {{ $labels.name }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $labels.name }} has not been seen for over 1 minute."  # message body
      # A container now runs an image it did not run 10 minutes ago: a deploy or a rollback.
      # Informational, so a broken deploy can be matched with the alerts that follow it.
      # Resolves by itself 10 minutes later (the old image drops out of the offset window).
      - alert: ContainerUpdated  # alert name, also the alertname label
        expr: |  # new (name, image) pair, on a container started in the last 2 minutes
          (count by (name, image) (container_last_seen{name!="", image!=""})
            unless count by (name, image) (container_last_seen{name!="", image!=""} offset 10m))
          and on (name) (time() - container_start_time_seconds{name!=""} < 120)
        labels: { severity: warning, category: deploys }  # severity warning: silent Telegram message
        annotations:  # text for the message, not used for routing
          dashboard: docker-projects  # Grafana "Docker Projects" dashboard (uid docker-projects)
          summary: "Deployed: {{ $labels.name }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $labels.name }} now runs {{ $labels.image }}."  # message body
  # Monitoring the monitoring: is the alert pipeline itself healthy.
  - name: meta  # group name, shown in the Prometheus/vmalert UI
    rules:  # rules of this group
      # Always firing. Grafana alerts if it disappears from VictoriaMetrics (Prometheus or remote_write is broken).
      - alert: Watchdog  # alert name, also the alertname label
        expr: vector(1)  # constant 1: always returns a result, so always firing
        labels: { severity: none, category: sre }  # severity none: matches no Telegram route; Alertmanager sends Watchdog to blackhole
        annotations:  # text for the message, not used for routing
          summary: "Watchdog heartbeat"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Always firing. Proves the alerting pipeline works end to end."  # message body
      # Samples rejected by VictoriaMetrics, or it is unreachable: long-term history is not being saved.
      - alert: PrometheusRemoteWriteFailing  # alert name, also the alertname label
        expr: rate(prometheus_remote_storage_samples_failed_total[5m]) > 0  # failed samples per second
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sre }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: alerts  # Grafana "Alerts" dashboard (uid alerts): target of the Dashboard link in Telegram
          summary: "Prometheus cannot write to VictoriaMetrics"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $value | printf \"%.1f\" }} samples/s are failing on remote_write."  # message body
      # Newest scraped sample vs newest sample delivered to VictoriaMetrics; >2m means the queue is stuck.
      - alert: PrometheusRemoteWriteBehind  # alert name, also the alertname label
        expr: (prometheus_remote_storage_highest_timestamp_in_seconds - ignoring(remote_name, url) group_right prometheus_remote_storage_queue_highest_sent_timestamp_seconds) > 120  # seconds between newest scraped and newest sent sample
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: warning, category: sre }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: alerts  # Grafana "Alerts" dashboard (uid alerts): target of the Dashboard link in Telegram
          summary: "Prometheus remote_write is lagging"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "remote_write is {{ $value | printf \"%.0f\" }}s behind."  # message body
      # Last config/rules reload failed: Prometheus keeps running on the OLD config until fixed.
      - alert: PrometheusConfigReloadFailed  # alert name, also the alertname label
        expr: prometheus_config_last_reload_successful == 0  # 1 = last reload OK, 0 = failed
        for: 1m  # condition must hold 1m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sre }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: alerts  # Grafana "Alerts" dashboard (uid alerts): target of the Dashboard link in Telegram
          summary: "Prometheus config reload failed"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "prometheus.yml or a rules file is invalid. Check the Prometheus logs."  # message body
      # A rule's query errors at evaluation time (e.g. bad label matching), so it can never fire.
      - alert: RuleEvaluationFailing  # alert name, also the alertname label
        expr: sum by (instance, group) (increase(vmalert_execution_errors_total[5m])) > 0  # failed group evaluations in 5m (both vmalerts)
        labels: { severity: warning, category: sre }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: alerts  # Grafana "Alerts" dashboard (uid alerts): target of the Dashboard link in Telegram
          summary: "Alert rule evaluation failing: {{ $labels.group }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $value | printf \"%.0f\" }} failed evaluations in 5 minutes ({{ $labels.instance }})."  # message body
      # vmalert cannot hand alerts to Alertmanager: every alert is lost.
      - alert: VmalertNotifierFailing  # alert name, also the alertname label
        expr: sum by (instance) (rate(vmalert_alerts_send_errors_total[5m])) > 0  # failed sends to Alertmanager
        for: 2m  # condition must hold 2m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sre }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: alerts  # Grafana "Alerts" dashboard (uid alerts): target of the Dashboard link in Telegram
          summary: "vmalert cannot reach Alertmanager ({{ $labels.instance }})"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Alerts cannot be delivered."  # message body
      # Telegram API rejected or unreachable (bad token/chat_id, network). This message may not arrive;
      # Grafana's WatchdogMissing/AlertmanagerDown rules are the backup path.
      - alert: AlertmanagerNotificationsFailing  # alert name, also the alertname label
        expr: rate(alertmanager_notifications_failed_total[5m]) > 0  # failed notifications per second, per integration
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sre }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: alerts  # Grafana "Alerts" dashboard (uid alerts): target of the Dashboard link in Telegram
          summary: "Alertmanager cannot deliver to {{ $labels.integration }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Notifications are failing. Check the bot token and chat_id."  # message body

  # Logs pipeline health: Vector → VictoriaLogs → vmalert.
  - name: logs-pipeline  # group name, shown in the Prometheus/vmalert UI
    rules:  # rules of this group
      # Vector gave up on log lines (VictoriaLogs rejecting, buffer full): those logs are lost.
      - alert: VectorLogsDropped  # alert name, also the alertname label
        expr: sum(rate(vector_component_discarded_events_total{component_id="victorialogs", intentional="false"}[5m])) > 0  # log lines dropped per second
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sre }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: logs  # Grafana "Logs" dashboard (uid logs): target of the Dashboard link in Telegram
          summary: "Vector is dropping logs"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $value | printf \"%.1f\" }} log lines/s are not reaching VictoriaLogs."  # message body
      # Push requests failing: Vector is still retrying from its disk buffer, but logs are delayed.
      - alert: VectorCannotPush  # alert name, also the alertname label
        expr: sum(rate(vector_component_errors_total{component_id="victorialogs"}[5m])) > 0  # failed pushes per second
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: warning, category: sre }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: logs  # Grafana "Logs" dashboard (uid logs): target of the Dashboard link in Telegram
          summary: "Vector cannot push logs to VictoriaLogs"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Push requests are failing; logs are buffered and delayed."  # message body
      # No logs arriving at all for 15 minutes: Vector stopped collecting, or every container went quiet.
      - alert: LogsNotIngested  # alert name, also the alertname label
        expr: sum(rate(vl_rows_ingested_total[15m])) == 0  # log lines ingested per second over 15m
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: warning, category: sre }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: logs  # Grafana "Logs" dashboard (uid logs): target of the Dashboard link in Telegram
          summary: "VictoriaLogs receives no logs"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "No log lines ingested in the last 15 minutes. Check Vector: docker compose logs vector"  # message body
      # A log rule query fails (e.g. LogsQL syntax), so that alert can never fire.
      - alert: VmalertRuleErrors  # alert name, also the alertname label
        expr: sum by (alertname) (increase(vmalert_alerting_rules_errors_total[5m])) > 0  # failed evaluations per log rule in 5m
        labels: { severity: warning, category: sre }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: logs  # Grafana "Logs" dashboard (uid logs): target of the Dashboard link in Telegram
          summary: "Log alert rule failing: {{ $labels.alertname }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "vmalert cannot evaluate this rule. Check http://localhost:38880."  # message body

      # A service that normally logs has gone quiet: it may be hung (alive but doing nothing).
      # "Normally logs" = it logged in more than half of the 5-minute windows of the last 24h, so
      # services that only log at startup (node-exporter, blackbox) never trigger this.
      # Only running containers count, so a stopped service is left to ContainerGone.
      - alert: LogSilence  # alert name, also the alertname label
        expr: |  # usually logs  AND  nothing in 30m  AND  container is running
          (avg_over_time((sum by (service) (service_level:log_lines:rate5m) > bool 0)[24h:5m]) > 0.5)
          and on (service) (sum by (service) (max_over_time(service_level:log_lines:rate5m[30m])) == 0)
          and on (service) label_replace(max by (container_label_com_docker_compose_service) (time() - container_last_seen{name!=""} < 60), "service", "$1", "container_label_com_docker_compose_service", "(.+)")
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: warning, category: sre }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: logs  # Grafana "Logs" dashboard (uid logs): target of the Dashboard link in Telegram
          summary: "No logs from {{ $labels.service }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $labels.service }} usually logs but has been silent for 30 minutes while running. It may be hung."  # message body

  # Traces. Span metrics come from Tempo's metrics generator (remote-written into Prometheus).
  - name: traces  # group name, shown in the Prometheus/vmalert UI
    rules:  # rules of this group
      # Tempo refused spans: ingestion limit, trace too big, or not enough memory. Those traces are incomplete.
      - alert: TempoDiscardingSpans  # alert name, also the alertname label
        expr: sum by (reason) (rate(tempo_discarded_spans_total[5m])) > 0  # refused spans/s by reason (rate_limited, trace_too_large, ...)
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: warning, category: sre }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: endpoints  # Grafana "Traces" dashboard (uid traces): target of the Dashboard link in Telegram
          summary: "Tempo is dropping spans ({{ $labels.reason }})"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "{{ $value | printf \"%.1f\" }} spans/s refused. Raise the limit in tempo/tempo.yaml overrides or find the noisy app."  # message body
      # Vector cannot deliver spans to Tempo (Tempo down or overloaded).
      - alert: VectorTraceExportFailing  # alert name, also the alertname label
        expr: sum(rate(vector_component_errors_total{component_id="tempo"}[5m])) > 0  # failed trace pushes per second
        for: 5m  # condition must hold 5m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sre }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: endpoints  # Grafana "Traces" dashboard (uid traces): target of the Dashboard link in Telegram
          summary: "Vector cannot send traces to Tempo"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Spans are being lost. Check: docker compose logs tempo"  # message body
  # Disk health (smartctl-exporter, profile "smart") and internet speed (speedtest-exporter).
  - name: hardware  # group name, shown in the Prometheus/vmalert UI
    rules:  # rules of this group
      # The disk's own self-assessment says it is failing. Back up now, replace the disk.
      - alert: DiskSmartFailed  # alert name, also the alertname label
        expr: smartctl_device_smart_status == 0  # 1 = SMART passed, 0 = failed
        labels: { severity: critical, category: server }  # severity critical: loud Telegram message, repeated every 1h, inhibits warnings for the same target
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview)
          summary: "SMART failed on {{ $labels.device }}"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Disk {{ $labels.device }} reports SMART failure. Back up its data and replace it."  # message body
      # HDDs wear faster above ~50°C; most drives are rated to 60°C.
      - alert: DiskTemperatureHigh  # alert name, also the alertname label
        expr: smartctl_device_temperature{temperature_type="current"} > 55  # current disk temperature in °C
        for: 10m  # condition must hold 10m before firing (shorter blips are ignored)
        labels: { severity: warning, category: server }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview)
          summary: "Disk {{ $labels.device }} is hot: {{ $value }}°C"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Above 55°C for 10 minutes. Check fans and airflow."  # message body
      # SSD wear: percentage of rated write endurance already used.
      - alert: SsdWearHigh  # alert name, also the alertname label
        expr: smartctl_device_percentage_used > 90  # % of rated endurance used
        labels: { severity: warning, category: server }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview)
          summary: "SSD {{ $labels.device }} is {{ $value }}% worn"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "Plan a replacement before it reaches 100%."  # message body
      # Speed test could not run (no internet or Speedtest.net unreachable). Scraped every 30m,
      # so look back 1h instead of using "for".
      - alert: SpeedtestFailing  # alert name, also the alertname label
        expr: max_over_time(speedtest_up[1h]) == 0  # 0 = every test in the last hour failed
        labels: { severity: warning, category: server }  # severity warning: silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: overview  # Grafana "Server Overview" dashboard (uid overview)
          summary: "Speed test failing"  # message headline; {{ $labels.x }} = label value, {{ $value }} = query result
          description: "No successful speed test for 1 hour. Check internet. Logs: docker compose logs speedtest-exporter"  # message body
  # Proxies: upstream errors are the backend's problem, seen at the edge.
  - name: by-type  # group name, shown in the Prometheus/vmalert UI
    rules:  # rules of this group
      - alert: ProxyUpstreamErrors  # alert name, also the alertname label
        expr: sum by (instance, service, project, env) (rate(traefik_service_requests_total{code=~"502|503|504"}[5m])) / sum by (instance, service, project, env) (rate(traefik_service_requests_total[5m])) > 0.05  # over 5% bad gateway / unavailable / timeout
        for: 5m  # condition must hold 5m before firing
        labels: { severity: critical, category: sites }  # loud Telegram message
        annotations:  # text for the message, not used for routing
          dashboard: container  # Grafana "Container" dashboard
          summary: "Proxy: upstream {{ $labels.service }} failing ({{ $value | humanizePercentage }} 502/503/504)"  # message headline
          description: "The backend behind {{ $labels.service }} is down, refusing connections or timing out."  # message body

  # Monitoring stack health and alert quality. Goes to the SRE topic, not to the app teams.
  - name: sre  # group name, shown in the Prometheus/vmalert UI
    rules:  # rules of this group
      # A monitoring component itself is down: its data (metrics, logs, traces, alerts) is missing.
      # TargetDown skips these jobs, so each outage is reported once, here.
      - alert: MonitoringComponentDown  # alert name, also the alertname label
        expr: up{job=~"prometheus|victoriametrics|victorialogs|vector|vmalert|tempo|alertmanager"} == 0  # scrape of a monitoring component failed
        for: 1m  # condition must hold 1m before firing (shorter blips are ignored)
        labels: { severity: critical, category: sre }  # loud Telegram message, repeated every 1h
        annotations:  # text for the message, not used for routing
          dashboard: sre  # Grafana "SRE" dashboard
          summary: "Monitoring: {{ $labels.job }} is down"  # message headline
          description: "{{ $labels.instance }} not responding for 1 minute. Its data is not collected. Logs: make logs s={{ $labels.job }}"  # message body
      # Storage of VictoriaMetrics or VictoriaLogs runs out within a day at the current rate.
      - alert: MonitoringStorageFillsIn24h  # alert name, also the alertname label
        expr: predict_linear(vm_free_disk_space_bytes[6h], 86400) < 0 or predict_linear(vl_free_disk_space_bytes[6h], 86400) < 0  # free bytes in 24h, from the 6h trend
        for: 30m  # condition must hold 30m before firing
        labels: { severity: critical, category: sre }  # loud Telegram message, repeated every 1h
        annotations:  # text for the message, not used for routing
          dashboard: sre  # Grafana "SRE" dashboard
          summary: "Monitoring storage full within 24h ({{ $labels.job }})"  # message headline
          description: "At the current rate the disk of {{ $labels.job }} runs out in a day: writes stop. Lower retention or add disk."  # message body
      # Many new series per second for 30 minutes: a label with unbounded values (user id, URL, ...).
      - alert: CardinalityExplosion  # alert name, also the alertname label
        expr: sum(rate(vm_new_timeseries_created_total[10m])) > 100  # new series per second
        for: 30m  # condition must hold 30m before firing
        labels: { severity: warning, category: sre }  # silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: sre  # Grafana "SRE" dashboard
          summary: "{{ $value | printf \"%.0f\" }} new series/s in VictoriaMetrics"  # message headline
          description: "Some label has unbounded values: memory and disk grow fast. Find it: VictoriaMetrics UI > Cardinality explorer."  # message body
      # Inserts that miss the cache are slow; over 10% means VictoriaMetrics needs more RAM or fewer series.
      - alert: VictoriaMetricsSlowInserts  # alert name, also the alertname label
        expr: sum(rate(vm_slow_row_inserts_total[5m])) / sum(rate(vm_rows_added_to_storage_total[5m])) > 0.1  # share of slow inserts
        for: 15m  # condition must hold 15m before firing
        labels: { severity: warning, category: sre }  # silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: sre  # Grafana "SRE" dashboard
          summary: "VictoriaMetrics: {{ $value | humanizePercentage }} slow inserts"  # message headline
          description: "Too many active series for the available RAM: ingestion lags and queries slow down."  # message body
      # One alert keeps firing and resolving: its threshold or "for" is wrong, people start ignoring it.
      # ALERTS_FOR_STATE (written by vmalert) holds the activation time; it changes on every new firing.
      - alert: AlertFlapping  # alert name, also the alertname label
        expr: sum by (alertname) (changes(ALERTS_FOR_STATE[1h])) > 4  # new activations in 1h
        labels: { severity: warning, category: sre }  # silent Telegram message, repeated every 4h
        annotations:  # text for the message, not used for routing
          dashboard: alerts  # Grafana "Alerts" dashboard
          summary: "Alert {{ $labels.alertname }} is flapping"  # message headline
          description: "Fired {{ $value | printf \"%.0f\" }} times in 1 hour. Raise its threshold or its \"for\"."  # message body
      # Many alerts at once usually share one cause (network, host, database): look for it first.
      - alert: AlertStorm  # alert name, also the alertname label
        expr: count(ALERTS{alertstate="firing", severity=~"critical|warning"}) > 20  # firing alerts right now
        for: 5m  # condition must hold 5m before firing
        labels: { severity: critical, category: sre }  # loud Telegram message, repeated every 1h
        annotations:  # text for the message, not used for routing
          dashboard: alerts  # Grafana "Alerts" dashboard
          summary: "Alert storm: {{ $value }} alerts firing"  # message headline
          description: "More than 20 alerts at once usually have one common cause. Start from the oldest one."  # message body
