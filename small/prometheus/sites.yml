# Sites probed by blackbox (job "blackbox-http" in prometheus.yml).
# Add or remove a URL and save: Prometheus re-reads this file every 30s, no restart needed.
# Each probe produces probe_success (1/0), probe_duration_seconds and probe_ssl_earliest_cert_expiry,
# which feed the SiteDown, SiteSlow and SslExpiresSoon alerts.
#
# Extra labels can be attached to a group of targets, e.g. to tell environments apart:
# - targets: [https://api.example.com]
#   labels:
#     env: prod

- targets:  # one group of sites (can carry shared labels)
    - http://grafana-s-grafana:3000/api/health   # internal check: is our own Grafana answering

# Demo containers: down whenever their profile is off, so env="demo" keeps their alerts out of
# Telegram (alertmanager.yml routes env="demo" to blackhole).
- targets:
    - http://grafana-s-nginx-demo/                # demo nginx: steady traffic for the file-log pipeline (Logs dashboard)
    - http://grafana-s-traefik-demo/              # demo proxy (profile "proxy"): traffic for the Proxy dashboard
  labels: { env: demo }
